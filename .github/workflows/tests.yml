name: Browser regressions
on:
  push:
    branches: [main]
    paths: ['index.html', 'package*.json', 'tests/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['index.html', 'package*.json', 'tests/**', '.github/workflows/tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
        env:
          LLG_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: failures-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
